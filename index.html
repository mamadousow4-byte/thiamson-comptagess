<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiamson - Comptages</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .counter-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .counter-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .counter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .counter-name {
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            background: transparent;
            width: 100%;
            color: var(--text-color);
            outline: none;
            padding: 0.25rem;
            border-radius: 0.25rem;
        }

        .counter-name:focus {
            background: #ffffff;
            border: 1px solid var(--primary);
        }

        .counter-value {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary);
            margin: 0.25rem 0;
        }

        .counter-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        button {
            cursor: pointer;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 1rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-decrement {
            background-color: #fee2e2;
            color: var(--danger);
        }

        .btn-decrement:hover {
            background-color: #fecaca;
        }

        .btn-increment {
            background-color: #dbeafe;
            color: var(--primary);
        }

        .btn-increment:hover {
            background-color: #bfdbfe;
        }

        .btn-delete {
            background-color: transparent;
            color: #94a3b8;
            padding: 0.25rem;
            font-size: 0.9rem;
        }

        .btn-delete:hover {
            color: var(--danger);
        }

        .actions-global {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
            width: 100%;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .total-global {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #f1f5f9;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thiamson - Comptages</h1>

        <div class="total-global">
            Total général : <span id="global-total">0</span>
        </div>

        <div id="counter-list" class="counter-list">
            <!-- Les compteurs seront injectés ici dynamiquement -->
        </div>

        <div class="actions-global">
            <button class="btn-primary" onclick="addCounter()">+ Ajouter un élément / troupeau</button>
            <button class="btn-secondary" onclick="resetAll()">Remettre tous les compteurs à zéro</button>
        </div>
    </div>

    <script>
        let counters = JSON.parse(localStorage.getItem('thiamson_counters')) || [
            { id: 1, name: 'Élément 1', value: 0 }
        ];

        function saveAndRender() {
            localStorage.setItem('thiamson_counters', JSON.stringify(counters));
            render();
        }

        function render() {
            const listElement = document.getElementById('counter-list');
            const globalTotalElement = document.getElementById('global-total');
            
            listElement.innerHTML = '';
            let globalTotal = 0;

            counters.forEach(counter => {
                globalTotal += counter.value;

                const card = document.createElement('div');
                card.className = 'counter-card';
                card.innerHTML = `
                    <div class="counter-header">
                        <input type="text" class="counter-name" value="${counter.name}" onchange="updateName(${counter.id}, this.value)" placeholder="Nom de l'élément">
                        ${counters.length > 1 ? `<button class="btn-delete" onclick="deleteCounter(${counter.id})">Supprimer</button>` : ''}
                    </div>
                    <div class="counter-value">${counter.value}</div>
                    <div class="counter-controls">
                        <button class="btn-decrement" onclick="decrement(${counter.id})">- Retirer</button>
                        <button class="btn-increment" onclick="increment(${counter.id})">+ Ajouter</button>
                    </div>
                `;
                listElement.appendChild(card);
            });

            globalTotalElement.textContent = globalTotal;
        }

        function increment(id) {
            const counter = counters.find(c => c.id === id);
            if (counter) {
                counter.value++;
                saveAndRender();
            }
        }

        function decrement(id) {
            const counter = counters.find(c => c.id === id);
            if (counter && counter.value > 0) {
                counter.value--;
                saveAndRender();
            }
        }

        function updateName(id, newName) {
            const counter = counters.find(c => c.id === id);
            if (counter) {
                counter.name = newName.trim() || 'Sans nom';
                saveAndRender();
            }
        }

        function addCounter() {
            const newId = counters.length > 0 ? Math.max(...counters.map(c => c.id)) + 1 : 1;
            counters.push({ id: newId, name: `Élément ${newId}`, value: 0 });
            saveAndRender();
        }

        function deleteCounter(id) {
            if (counters.length > 1) {
                counters = counters.filter(c => c.id !== id);
                saveAndRender();
            }
        }

        function resetAll() {
            if (confirm("Voulez-vous vraiment remettre tous les compteurs à zéro ?")) {
                counters.forEach(c => c.value = 0);
                saveAndRender();
            }
        }

        // Initialisation au chargement
        render();
    </script>
</body>
</html>
