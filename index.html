<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Thiamson - Comptages Intelligent</title>
    <style>
        :root {
            --primary: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #16a34a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 12px; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        h1 { color: var(--primary); font-size: 1.4rem; text-align: center; font-weight: 800; }
        .result-card { background: linear-gradient(135deg, #1e40af, #2563eb); color: white; border-radius: 12px; padding: 16px; text-align: center; }
        .result-card .title-detected { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; opacity: 0.9; }
        .result-card .value { font-size: 2.5rem; font-weight: 900; }
        .btn { border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; background: var(--primary); color: white; width: 100%; transition: 0.2s; }
        .btn:active { opacity: 0.9; }
        .btn-danger { background: var(--danger); }
        input[type="file"], input[type="password"] { display: none; }
        .image-viewport { position: relative; width: 100%; min-height: 250px; background: #000; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        img, canvas { max-width: 100%; max-height: 50vh; object-fit: contain; }
        .placeholder { color: #94a3b8; text-align: center; padding: 20px; font-size: 0.9rem; }
        .config-box { background: #f1f5f9; padding: 10px; border-radius: 8px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; }
        .config-box input { padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.9rem; width: 100%; }
        .loading { font-size: 0.9rem; color: #2563eb; font-weight: bold; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thiamson - Comptages IA</h1>

        <div class="config-box">
            <label for="api-key"><b>Clé API Gemini :</b></label>
            <input type="password" id="api-key" placeholder="Collez votre clé API ici..." onchange="saveApiKey()">
            <small style="color: #64748b;">Nécessaire pour l'analyse intelligente et la reconnaissance des objets/animaux.</small>
        </div>

        <div class="result-card">
            <div class="title-detected" id="category-display">En attente d'une photo...</div>
            <div class="value" id="count-display">0</div>
        </div>

        <button class="btn" onclick="triggerCapture()">📷 Prendre une photo / Importer</button>
        <input type="file" id="file-input" accept="image/*" capture="environment" onchange="analyzeImage(event)">

        <div class="loading" id="loading-text">Analyse intelligente de l'image en cours... Veuillez patienter.</div>

        <div class="image-viewport">
            <div class="placeholder" id="placeholder">Prenez une photo (ex: troupeau, sacs, foule) pour l'analyser.</div>
            <img id="preview-img" style="display: none;" alt="Photo analysée">
        </div>

        <button class="btn btn-danger" onclick="resetAll()">Réinitialiser</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewImg = document.getElementById('preview-img');
        const countDisplay = document.getElementById('count-display');
        const categoryDisplay = document.getElementById('category-display');
        const placeholder = document.getElementById('placeholder');
        const loadingText = document.getElementById('loading-text');
        const apiKeyInput = document.getElementById('api-key');

        // Charger la clé API si elle est enregistrée dans le téléphone
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }
        };

        function saveApiKey() {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        }

        function triggerCapture() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert("Veuillez d'abord renseigner votre clé API Gemini dans le champ prévu en haut.");
                return;
            }
            fileInput.click();
        }

        function analyzeImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                previewImg.src = base64Data;
                previewImg.style.display = 'block';
                placeholder.style.display = 'none';

                // Lancer l'analyse par l'IA
                sendToGeminiVision(base64Data);
            };
            reader.readAsDataURL(file);
        }

        async function sendToGeminiVision(base64Image) {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("Clé API manquante.");
                return;
            }

            loadingText.style.display = 'block';
            categoryDisplay.innerText = "Analyse en cours...";
            countDisplay.innerText = "...";

            // Extraire les données brutes base64
            const base64Clean = base64Image.split(',')[1];
            const mimeType = base64Image.split(';')[0].split(':')[1];

            const promptText = "Analyse cette image de manière précise. Identifie ce qu'elle représente (par exemple: troupeau de bœufs, sacs de cacao, foule humaine, objets spécifiques, etc.). Donne-moi le nom exact de la catégorie et le nombre total exact d'individus ou d'objets présents. Réponds strictement sous ce format JSON : {\"category\": \"Nom de la catégorie (ex: Bœufs, Sacs de cacao)\", \"count\": nombre_exact, \"description\": \"courte phrase de résumé\"}";

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            const payload = {
                contents: [
                    {
                        parts: [
                            { text: promptText },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: base64Clean
                                }
                            }
                        ]
                    }
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                loadingText.style.display = 'none';

                if (data.candidates && data.candidates[0].content) {
                    const textResponse = data.candidates[0].content.parts[0].text;
                    
                    // Nettoyer la réponse pour extraire le JSON
                    const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        const result = JSON.parse(jsonMatch[0]);
                        categoryDisplay.innerText = result.category;
                        countDisplay.innerText = result.count;
                    } else {
                        categoryDisplay.innerText = "Résultat brut";
                        countDisplay.innerText = "?";
                        alert(textResponse);
                    }
                } else {
                    throw new Error("Réponse invalide de l'IA");
                }

            } catch (error) {
                loadingText.style.display = 'none';
                categoryDisplay.innerText = "Erreur d'analyse";
                countDisplay.innerText = "0";
                alert("Erreur lors de la connexion à l'IA : " + error.message);
            }
        }

        function resetAll() {
            previewImg.src = '';
            previewImg.style.display = 'none';
            placeholder.style.display = 'block';
            categoryDisplay.innerText = "En attente d'une photo...";
            countDisplay.innerText = '0';
            fileInput.value = '';
            loadingText.style.display = 'none';
        }
    </script>
</body>
</html>
