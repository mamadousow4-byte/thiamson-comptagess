<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Thiamson - Comptages Intelligent</title>
    <style>
        :root {
            --primary: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 16px; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 6px 24px rgba(0,0,0,0.08); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        h1 { color: var(--primary); font-size: 1.5rem; text-align: center; font-weight: 800; }
        
        .result-card { background: linear-gradient(135deg, #1e40af, #2563eb); color: white; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
        .result-card .title-detected { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; opacity: 0.95; text-transform: uppercase; letter-spacing: 0.5px; }
        .result-card .value { font-size: 3.5rem; font-weight: 900; }
        
        .btn { border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 1.05rem; cursor: pointer; text-align: center; background: var(--primary); color: white; width: 100%; transition: transform 0.1s, opacity 0.2s; box-shadow: 0 4px 10px rgba(30,64,175,0.2); }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-danger { background: var(--danger); box-shadow: 0 4px 10px rgba(239,68,68,0.2); }
        
        input[type="file"] { display: none; }
        .image-viewport { position: relative; width: 100%; min-height: 280px; background: #0f172a; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px dashed var(--border-color); }
        img { max-width: 100%; max-height: 55vh; object-fit: contain; }
        .placeholder { color: #94a3b8; text-align: center; padding: 20px; font-size: 0.95rem; line-height: 1.4; }
        .loading { font-size: 1rem; color: #2563eb; font-weight: bold; text-align: center; display: none; padding: 8px; background: #eff6ff; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thiamson - Comptages IA</h1>

        <div class="result-card">
            <div class="title-detected" id="category-display">Mode Killer Actif</div>
            <div class="value" id="count-display">0</div>
        </div>

        <button class="btn" onclick="triggerCapture()">📷 Prendre une photo / Importer</button>
        <input type="file" id="file-input" accept="image/*" capture="environment" onchange="analyzeImage(event)">

        <div class="loading" id="loading-text">Analyse intelligente en cours... L'IA identifie et compte les éléments.</div>

        <div class="image-viewport">
            <div class="placeholder" id="placeholder">Prenez une photo : bœufs, rouleaux de tissus, foules ou objets. Tout sera identifié et compté !</div>
            <img id="preview-img" style="display: none;" alt="Photo analysée">
        </div>

        <button class="btn btn-danger" onclick="resetAll()">🔄 Réinitialiser</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewImg = document.getElementById('preview-img');
        const countDisplay = document.getElementById('count-display');
        const categoryDisplay = document.getElementById('category-display');
        const placeholder = document.getElementById('placeholder');
        const loadingText = document.getElementById('loading-text');

        function triggerCapture() {
            fileInput.click();
        }

        function analyzeImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                previewImg.src = base64Data;
                previewImg.style.display = 'block';
                placeholder.style.display = 'none';

                sendToGeminiVision(base64Data);
            };
            reader.readAsDataURL(file);
        }

        async function sendToGeminiVision(base64Image) {
            loadingText.style.display = 'block';
            categoryDisplay.innerText = "Analyse en cours...";
            countDisplay.innerText = "...";

            const base64Clean = base64Image.split(',')[1];
            const mimeType = base64Image.split(';')[0].split(':')[1];

            const promptText = "Analyse cette image avec une extrême précision. Identifie clairement ce qu'elle représente (par exemple: Troupeau de bœufs, Rouleaux de tissu, Êtres humains, Foule, etc.). Donne-moi le nom exact de la catégorie et le nombre total exact d'individus ou d'objets présents. Réponds strictement sous ce format JSON : {\"category\": \"Nom exact de la catégorie\", \"count\": nombre_exact}";

            // Votre jeton d'authentification intégré en dur pour tourner en arrière-plan à vie
            const accessToken = "AQ.Ab8RN6I_2RK2y_yLFnMWKHw31MXV5TGJAEmXL2VNqOmobFJZfg"; 

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`;

            const payload = {
                contents: [
                    {
                        parts: [
                            { text: promptText },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: base64Clean
                                }
                            }
                        ]
                    }
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                loadingText.style.display = 'none';

                if (data.candidates && data.candidates[0].content) {
                    const textResponse = data.candidates[0].content.parts[0].text;
                    
                    const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        const result = JSON.parse(jsonMatch[0]);
                        categoryDisplay.innerText = result.category;
                        countDisplay.innerText = result.count;
                    } else {
                        categoryDisplay.innerText = "Résultat";
                        countDisplay.innerText = "?";
                        alert(textResponse);
                    }
                } else {
                    throw new Error(data.error ? data.error.message : "Erreur de réponse de l'IA");
                }

            } catch (error) {
                loadingText.style.display = 'none';
                categoryDisplay.innerText = "Erreur d'analyse";
                countDisplay.innerText = "0";
                alert("Erreur technique : " + error.message);
            }
        }

        function resetAll() {
            previewImg.src = '';
            previewImg.style.display = 'none';
            placeholder.style.display = 'block';
            categoryDisplay.innerText = "Mode Killer Actif";
            countDisplay.innerText = '0';
            fileInput.value = '';
            loadingText.style.display = 'none';
        }
    </script>
</body>
</html>
